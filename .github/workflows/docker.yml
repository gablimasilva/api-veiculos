name: docker

on:
  push:
    branches:
      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VehicleSales

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore VehicleSales.sln

      - name: Build
        run: dotnet build VehicleSales.sln --no-restore

      - name: Test
        run: dotnet test VehicleSales.sln --no-build

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/vehicle-sales-api:latest \
          -f ../Dockerfile \
          ..

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/vehicle-sales-api:latest