name: deploy

on:
  workflow_run:
    workflows:
      - docker
    types:
      - completed

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Create Kubernetes Secrets
        run: |
          kubectl create secret generic vehicle-sales-secrets \
            --from-literal=ConnectionStrings__DefaultConnection="Host=${{ secrets.DB_HOST }};Port=${{ secrets.DB_PORT }};Database=${{ secrets.DB_NAME }};Username=${{ secrets.DB_USERNAME }};Password=${{ secrets.DB_PASSWORD }}" \
            --from-literal=Authentication__Authority="${{ secrets.COGNITO_AUTHORITY }}" \
            --from-literal=Authentication__Audience="${{ secrets.COGNITO_AUDIENCE }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Application
        run: |
          kubectl apply -f kubernetes/

      - name: Check Rollout
        run: |
          kubectl rollout status deployment/vehicle-sales-api